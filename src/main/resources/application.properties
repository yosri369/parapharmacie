spring.application.name=parapharmacy-backend
server.port=8081

# ================================
# PostgreSQL Database
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/vitanova_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=0000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================================
# Cloudinary (Image CDN)
# ================================
cloudinary.cloud-name=dddpkqxpj
cloudinary.api-key=937825132761493
cloudinary.api-secret=CzKyckhAGmSLWPvaIxho12CFCiU

# ================================
# JWT Configuration
# ================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-token.expiration=604800000

# ================================
# CORS - Allow Angular
# ================================
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:51101

# ================================
# File Upload
# ================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# SpringDoc / Swagger UI
# ================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ================================
# Logging
# ================================
logging.level.org.springframework.security=WARN

# ================================
# Email Configuration (SendGrid)
# ================================
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:dev-key-placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=noreply@parapharmacy.tn
app.mail.from-name=Parapharmacy

# ================================
# Konnect Payment Gateway
# ================================
konnect.api-key=${KONNECT_API_KEY:dev-key-placeholder}
konnect.api-secret=${KONNECT_API_SECRET:dev-secret-placeholder}
konnect.api-url=https://api.konnect.com
konnect.webhook-secret=${KONNECT_WEBHOOK_SECRET:dev-webhook-placeholder}
konnect.return-url=http://localhost:4200/payment-result

# ================================
# Google OAuth2 Login
# ================================
app.google.client-id=${GOOGLE_CLIENT_ID:your_placeholder_google_client_id_here.apps.googleusercontent.com}

# ================================
# Fal.ai - Real AI Image Generation (SDXL)
# Get your FREE key at: https://fal.ai/dashboard/keys
# ================================
fal.ai.key=${FAL_AI_KEY:YOUR_FAL_AI_KEY_HERE}
fal.ai.base-url=https://queue.fal.run

# ================================
# Leonardo AI - Cinematic Product Ad Generation
# Get your FREE key at: https://app.leonardo.ai -> Settings -> API Keys
# Free tier: ~150 tokens/day, perfect for testing
# ================================
leonardo.ai.key=${LEONARDO_AI_KEY:YOUR_LEONARDO_AI_KEY_HERE}

# ================================
# Async Thread Pool (for AI generation queue)
# ================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=20
spring.task.execution.thread-name-prefix=ai-gen-
